name: Lint

on:
  workflow_call:

jobs:

  golangci-lint:
    name: Golangci Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.x

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --issues-exit-code=1 --fix=false
          only-new-issues: false
