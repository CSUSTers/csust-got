name: Test

on:
  workflow_call:

jobs:

  test:
    name: Go Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:

      - name: Get source
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.x

      - name: Get deps
        run: make deps

      - name: Test
        run: make test
