name: Build Agent Runtime Image

on:
  push:
    branches-ignore:
      - 'dependabot/**'
    paths:
      - 'agent-runtime/**'
      - '.github/workflows/agent-runtime.yml'
  release:
    types:
      - published

jobs:
  build:
    name: Build and Push (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: runtime
            image: csusters/agent-runtime
          - target: broker
            image: csusters/agent-fetch-broker
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Sanitize ref name for Docker tag
        id: sanitize
        run: |
          # Replace / with - in ref name to make it valid for Docker tags
          SANITIZED_REF=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
          echo "tag_name=$SANITIZED_REF" >> $GITHUB_OUTPUT

      - name: Build Image
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ matrix.image }}
          tags: |
            ${{ github.event_name == 'release' && 'latest' || format('latest-{0}', steps.sanitize.outputs.tag_name) }}
            ${{ steps.sanitize.outputs.tag_name }}
          containerfiles: |
            ./agent-runtime/Dockerfile
          layers: true
          extra-args: --target=${{ matrix.target }}

      - name: Push To registry
        id: push-to-registry
        uses: CSUSTers/push-to-registry@main
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          retry: 1000
