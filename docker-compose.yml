version: '3.8'

x-common: &common
  restart: always

services:

  bot:
    image: csust/csust-got:latest
    container_name: bot
    <<: *common
    restart: always
    depends_on:
      - redis
      - agent-runtime
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./logs:/app/logs
    links:
      - redis
      - agent-runtime
    ports:
      - "7777:7777"
    environment:
      - AGENT_RUNTIME_TOKEN=${AGENT_RUNTIME_TOKEN:-}

  agent-runtime:
    build:
      context: .
      dockerfile: agent-runtime/Dockerfile
    container_name: agent-runtime
    <<: *common
    environment:
      - AGENT_RUNTIME_TOKEN=${AGENT_RUNTIME_TOKEN:-}
      - AGENT_RUNTIME_WORKSPACE_ROOT=/runtime/workspaces
      - AGENT_RUNTIME_SKILLS_ROOT=/runtime/skills
      - AGENT_RUNTIME_TRACE_JSONL=/runtime/logs/runtime-traces.jsonl
      - AGENT_RUNTIME_BASH_SANDBOX=proot
    expose:
      - "8080"
    volumes:
      - ./agent-runtime/workspaces:/runtime/workspaces
      - ./skills:/runtime/skills:ro
      - ./logs:/runtime/logs

  redis:
    image: redis:alpine
    container_name: bot-redis
    <<: *common
    expose:
      - "6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
      - ./data:/data
    command:
      - /usr/local/etc/redis/redis.conf
