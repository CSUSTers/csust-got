[package]
name = "agent-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[features]
default = []
c7-test-support = []

[dependencies]
async-compression = { version = "0.4", features = ["tokio", "gzip", "deflate", "zlib", "brotli"] }
async-trait = "0.1"
anyhow = "1"
axum = "0.8"
bytes = "1"
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
diffy = "0.4"
futures-util = "0.3"
fs2 = "0.4"
getrandom = "0.3"
hickory-resolver = { version = "0.25", default-features = false, features = ["tokio"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
ipnet = "2"
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
walkdir = "2"
webpki-roots = "1"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
seccompiler = { version = "=0.5.0", default-features = false }

[dev-dependencies]
brotli = "8"
flate2 = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
